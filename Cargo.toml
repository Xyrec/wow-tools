[package]
name = "wow-tools"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.34", features = ["bundled"] }
scraper = "0.22"
regex = "1"
indexmap = { version = "2", features = ["serde"] }
