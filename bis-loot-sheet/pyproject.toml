[project]
name = "bis-pipeline"
version = "0.1.0"
description = "WCL rankings fetcher and BiS aggregation pipeline for guild loot priority"
readme = "README.md"
authors = [
    { name = "Xyrec", email = "itsgonnabealongnight@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
bis-pipeline = "bis_pipeline:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
