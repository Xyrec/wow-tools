[project]
name = "bis-gear"
version = "0.1.0"
description = "TBC Shaman BiS gear checker (Resto / Elemental) — compares equipped gear against BiS lists and recommends dungeon/rep upgrades"
requires-python = ">=3.14"
dependencies = [
    "ruff>=0.15.6",
    "ty>=0.0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
bis-gear = "bis_gear.check_gear:main"
bis-parse = "bis_gear.parse_bis:main"
iv-parse = "bis_gear.parse_icy_veins:main"
wtbc-parse = "bis_gear.parse_wowtbc:main"
bis-compare = "bis_gear.compare_sources:main"
item-lookup = "bis_gear.item_lookup:main"
